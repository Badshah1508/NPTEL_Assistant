version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nptel-postgres
    restart: always
    environment:
      POSTGRES_USER: nptel_user
      POSTGRES_PASSWORD: nptel_secure_password
      POSTGRES_DB: nptel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nptel_user -d nptel_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nptel-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://nptel_user:nptel_secure_password@postgres:5432/nptel_db
      - STORAGE_DIR=/app/storage
      - AI_PROVIDER=mock
      - AI_MODEL=nptel-assistant-deterministic-v1
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nptel-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
