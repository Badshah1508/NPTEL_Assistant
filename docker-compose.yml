version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: studypilot-postgres
    restart: always
    environment:
      POSTGRES_USER: studypilot_user
      POSTGRES_PASSWORD: studypilot_secure_password
      POSTGRES_DB: studypilot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studypilot_user -d studypilot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studypilot-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://studypilot_user:studypilot_secure_password@postgres:5432/studypilot_db
      - STORAGE_DIR=/app/storage
      - AI_PROVIDER=mock
      - AI_MODEL=studypilot-deterministic-v1
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: studypilot-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
